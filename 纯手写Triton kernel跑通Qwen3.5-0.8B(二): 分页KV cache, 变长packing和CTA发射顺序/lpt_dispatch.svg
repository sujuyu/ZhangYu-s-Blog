<text class="h" x="60" y="378" text-anchor="start" >逆序发射 q7 -> q0: 重的先占住 SM, 轻的填空</text>
<g filter="url(#wob2)"><rect class="box" x="132.0" y="398" width="189.0" height="21" rx="3" fill="#f0a868"/></g>
<text class="xs" x="226.5" y="413" text-anchor="middle" >q7</text>
