<text class="xs" x="120" y="465" text-anchor="end" >SM2</text>
<text class="xs" x="120" y="491" text-anchor="end" >SM3</text>
<path class="dash" d="M 348.0 392 L 348.0 504"/>
<text class="h" x="356.0" y="458" text-anchor="start" >9</text>
<text class="l" x="450.0" y="540" text-anchor="middle" >总工作量 36 不变, 4 个 SM 的理论下界就是 9 -- 逆序一行代码就够到了下界</text>
