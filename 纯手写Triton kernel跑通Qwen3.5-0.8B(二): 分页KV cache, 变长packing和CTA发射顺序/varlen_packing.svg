<text class="s" x="664" y="186" text-anchor="middle" >total_tokens = 14, 一个废格子都没有</text>
<text class="l" x="664" y="214" text-anchor="middle" >cu_seqlens = [0, 3, 9, 10, 14]</text>
<text class="xs" x="664" y="236" text-anchor="middle" >边界就靠这一个数组说清楚</text>
<g filter="url(#wob)"><rect class="box" x="46" y="288" width="808" height="130" rx="6" fill="#ffffff"/></g>
<text class="h" x="70" y="312" text-anchor="start" >为什么不需要造一个块对角的 mask 矩阵</text>
<text class="l" x="70" y="336" text-anchor="start" >因为压根不会算到. 每条序列的 attention 循环边界来自它自己的 cu_seqlens --</text>
<text class="l" x="70" y="355" text-anchor="start" >q 在第 b 条里, 内层就只从 cu_seqlens[b] 扫到 cu_seqlens[b+1], 跨序列的位置</text>
<text class="l" x="70" y="374" text-anchor="start" >从来没有进过循环. 块对角是这么 "自动" 出来的, 不是靠一个矩阵挡出来的.</text>
<text class="l" x="70" y="393" text-anchor="start" ></text>
<text class="s" x="70" y="412" text-anchor="start" >整个 24 层里只有三个算子需要知道边界: attention, conv4_prefill, GDN 递推.</text>
<text class="l" x="450.0" y="452" text-anchor="middle" >其余逐 token 的算子拿 [total_tokens, ...] 一行都不用改</text>
</svg>
