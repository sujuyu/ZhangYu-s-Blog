<rect class="box" x="92" y="174" width="280.0" height="26" rx="4" fill="#e8e4de"/>
<rect class="box" x="92" y="174" width="218.75" height="26" rx="4" fill="#f0a868"/>
</g>
<text class="xs" x="380.0" y="193" text-anchor="start" >200</text>
<text class="s" x="66" y="240" text-anchor="start" >#2</text>
