<rect class="box" x="92" y="220" width="280.0" height="26" rx="4" fill="#e8e4de"/>
<rect class="box" x="92" y="220" width="10.9375" height="26" rx="4" fill="#82c09a"/>
</g>
<text class="xs" x="380.0" y="239" text-anchor="start" >10</text>
<text class="s" x="66" y="286" text-anchor="start" >#3</text>
