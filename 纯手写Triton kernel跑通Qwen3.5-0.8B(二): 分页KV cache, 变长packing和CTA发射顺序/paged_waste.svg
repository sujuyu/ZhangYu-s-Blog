<rect class="box" x="92" y="266" width="280.0" height="26" rx="4" fill="#e8e4de"/>
<rect class="box" x="92" y="266" width="142.1875" height="26" rx="4" fill="#b39ddb"/>
</g>
<text class="xs" x="380.0" y="285" text-anchor="start" >130</text>
<path class="thinln" d="M 76 320 Q 156.0 317 236.0 320 T 396 319.0"/>
<text class="l" x="236" y="340" text-anchor="middle" >开了 1024 个槽, 只用了 380 个 -- 63% 是空的</text>
<g filter="url(#wob)"><rect class="box" x="474" y="84" width="380" height="268" rx="6" fill="#e9f4ec"/></g>
<text class="h" x="664" y="110" text-anchor="middle" >分页: 按 16 个 token 一页, 用多少要多少</text>
<text class="s" x="494" y="148" text-anchor="start" >#0</text>
<g filter="url(#wob2)">
<rect class="box" x="520" y="128" width="15" height="26" rx="3" fill="#7fb3d5"/>
<rect class="box" x="537" y="128" width="15" height="26" rx="3" fill="#7fb3d5"/>
<rect class="box" x="554" y="128" width="15" height="26" rx="3" fill="#e8e4de"/>
</g>
<text class="xs" x="577" y="147" text-anchor="start" >3 页</text>
<text class="s" x="494" y="194" text-anchor="start" >#1</text>
<g filter="url(#wob2)">
<rect class="box" x="520" y="174" width="15" height="26" rx="3" fill="#f0a868"/>
<rect class="box" x="537" y="174" width="15" height="26" rx="3" fill="#f0a868"/>
<rect class="box" x="554" y="174" width="15" height="26" rx="3" fill="#f0a868"/>
<rect class="box" x="571" y="174" width="15" height="26" rx="3" fill="#f0a868"/>
<rect class="box" x="588" y="174" width="15" height="26" rx="3" fill="#f0a868"/>
<rect class="box" x="605" y="174" width="15" height="26" rx="3" fill="#f0a868"/>
<rect class="box" x="622" y="174" width="15" height="26" rx="3" fill="#f0a868"/>
<rect class="box" x="639" y="174" width="15" height="26" rx="3" fill="#f0a868"/>
<rect class="box" x="656" y="174" width="15" height="26" rx="3" fill="#f0a868"/>
<rect class="box" x="673" y="174" width="15" height="26" rx="3" fill="#f0a868"/>
<rect class="box" x="690" y="174" width="15" height="26" rx="3" fill="#f0a868"/>
<rect class="box" x="707" y="174" width="15" height="26" rx="3" fill="#f0a868"/>
<rect class="box" x="724" y="174" width="15" height="26" rx="3" fill="#e8e4de"/>
</g>
<text class="xs" x="747" y="193" text-anchor="start" >13 页</text>
<text class="s" x="494" y="240" text-anchor="start" >#2</text>
<g filter="url(#wob2)">
<rect class="box" x="520" y="220" width="15" height="26" rx="3" fill="#e8e4de"/>
</g>
<text class="xs" x="543" y="239" text-anchor="start" >1 页</text>
<text class="s" x="494" y="286" text-anchor="start" >#3</text>
<g filter="url(#wob2)">
<rect class="box" x="520" y="266" width="15" height="26" rx="3" fill="#b39ddb"/>
<rect class="box" x="537" y="266" width="15" height="26" rx="3" fill="#b39ddb"/>
<rect class="box" x="554" y="266" width="15" height="26" rx="3" fill="#b39ddb"/>
<rect class="box" x="571" y="266" width="15" height="26" rx="3" fill="#b39ddb"/>
<rect class="box" x="588" y="266" width="15" height="26" rx="3" fill="#b39ddb"/>
<rect class="box" x="605" y="266" width="15" height="26" rx="3" fill="#b39ddb"/>
<rect class="box" x="622" y="266" width="15" height="26" rx="3" fill="#b39ddb"/>
<rect class="box" x="639" y="266" width="15" height="26" rx="3" fill="#b39ddb"/>
<rect class="box" x="656" y="266" width="15" height="26" rx="3" fill="#e8e4de"/>
</g>
<text class="xs" x="679" y="285" text-anchor="start" >9 页</text>
<path class="thinln" d="M 504 320 Q 584.0 317 664.0 320 T 824 319.0"/>
<text class="l" x="664" y="340" text-anchor="middle" >26 页 = 416 个槽, 浪费只剩每条尾页那几个</text>
<text class="l" x="450.0" y="386" text-anchor="middle" >浪费从 "按最长的开" 变成 "每条尾页最多空 15 个" -- 内部碎片, 有上界</text>
<text class="s" x="450.0" y="412" text-anchor="middle" >而且序列还在一边 decode 一边长: 整块方案里紧挨着排就会撞上邻居, 得搬数据;</text>
<text class="s" x="450.0" y="432" text-anchor="middle" >分页之后长满一页就再要一页, 落在哪都无所谓</text>
</svg>
