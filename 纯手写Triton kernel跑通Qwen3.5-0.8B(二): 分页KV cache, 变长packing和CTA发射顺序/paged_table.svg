<text class="h" x="450.0" y="122" text-anchor="middle" >block_table</text>
<text class="xs" x="450.0" y="144" text-anchor="middle" >[max_batch, max_pages]</text>
<text class="xs" x="450.0" y="170" text-anchor="middle" >一条序列一行, 互不相干</text>
