<text class="l" x="450.0" y="444" text-anchor="middle" >连线是乱的 -- 逻辑上连续的 token 落在物理上不相邻的页里, 这正是分页的意义</text>
<text class="s" x="450.0" y="472" text-anchor="middle" >推论: kernel 里 k_cache 的基址完全不带 batch 偏移, 只有 block_table 按 pid_b 偏</text>
