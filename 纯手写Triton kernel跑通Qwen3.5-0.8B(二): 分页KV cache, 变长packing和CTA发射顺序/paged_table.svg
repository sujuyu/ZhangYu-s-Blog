<text class="h" x="60" y="372" text-anchor="start" >页池 k_cache / v_cache  [num_pages, H_kv, PAGE, D]  -- 只有一份</text>
<text class="s" x="60" y="394" text-anchor="start" >空白的页在空闲链表里, reset 时全部归还</text>
