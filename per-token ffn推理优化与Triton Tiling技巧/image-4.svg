<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="42" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#222" text-anchor="start">Triton tiling：batch block 复用 per-token weight</text>
<text x="42" y="70" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#555" text-anchor="start">grid = (ceil(N / BLOCK_N), T, ceil(B / BLOCK_B))</text>
