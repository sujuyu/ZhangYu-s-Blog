<text x="930" y="320" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle">N blocks × B blocks</text>
<rect x="785" y="338" width="260" height="69" fill="#fff7ed" stroke="#c77700" rx="6"/>
<text x="915" y="367" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#9a6500" text-anchor="middle">out: [B, T, 1, N]</text>
<text x="915" y="390" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#9a6500" text-anchor="middle">store [BLOCK_B, BLOCK_N]</text>
<line x1="365" y1="214" x2="420" y2="260" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="365" y1="350" x2="420" y2="292" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="710" y1="370" x2="775" y2="370" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="62" y="470" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#333" text-anchor="start">1. T 维作为 grid 维度：每个 token 使用独立 KxN weight。</text>
<text x="62" y="498" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#333" text-anchor="start">2. N 维切 BLOCK_N：输出列方向独立，控制单个 program 的寄存器和矩阵规模。</text>
<text x="62" y="526" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#333" text-anchor="start">3. B 维切 BLOCK_B：提高 block/warp 数，同时让同一份 weight tile 被一组 batch 复用。</text>
<text x="62" y="554" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#333" text-anchor="start">4. K 维不切不循环：一次 tl.dot 完成 reduce，直接走 tensorcore。</text>
