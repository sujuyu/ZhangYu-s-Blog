<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <filter id="paper" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="2" seed="8" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="faint">
        <feFuncA type="table" tableValues="0 0.055"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faint" mode="multiply"/>
    </filter>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="21" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#384152"/>
    </marker>
    <style>
      .title { font: 700 38px "Comic Sans MS", "Noto Sans CJK SC", sans-serif; fill: #252936; }
      .subtitle { font: 600 24px "Comic Sans MS", "Noto Sans CJK SC", sans-serif; fill: #555d6e; }
      .label { font: 700 25px "Comic Sans MS", "Noto Sans CJK SC", sans-serif; fill: #2f3542; }
      .small { font: 600 20px "Comic Sans MS", "Noto Sans CJK SC", sans-serif; fill: #50586a; }
      .tiny { font: 600 17px "Comic Sans MS", "Noto Sans CJK SC", sans-serif; fill: #50586a; }
      .ink { stroke: #384152; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: #596174; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .dash { stroke-dasharray: 10 10; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="34" fill="#fffaf0"/>
  <rect x="18" y="18" width="1564" height="864" rx="28" fill="none" stroke="#384152" stroke-width="4" filter="url(#wobble)"/>
  <g filter="url(#paper)">
    <text x="62" y="72" class="title">计算轮次一触发，一批模型突然一起开工</text>
    <text x="64" y="112" class="subtitle">CPU 线程池看起来很忙，GPU 上却还是一条队伍</text>

    <!-- Event trigger and burst -->
    <g filter="url(#wobble)">
      <rect x="77" y="144" width="116" height="116" rx="28" fill="#ffe7a3" class="ink"/>
      <path d="M145 160 L107 211 H136 L124 246 L166 194 H138 Z" fill="#f59c55" class="thin"/>
      <path d="M91 126 L74 109 M177 126 L194 108 M135 120 L135 94" fill="none" class="thin"/>
    </g>
    <text x="78" y="286" class="label">事件触发</text>
    <text x="85" y="318" class="small">短时间突发</text>

    <!-- Source tensor -->
    <g filter="url(#wobble)">
      <rect x="55" y="380" width="250" height="292" rx="20" fill="#f6f1e4" class="ink"/>
      <path d="M93 430 V628 M126 430 V628 M162 430 V628 M202 430 V628 M250 430 V628" class="thin" fill="none"/>
      <path d="M76 470 H284 M76 514 H284 M76 559 H284 M76 604 H284" class="thin" fill="none"/>
      <rect x="93" y="430" width="69" height="84" fill="#ffc9c9" opacity="0.72"/>
      <rect x="126" y="514" width="76" height="90" fill="#bde0fe" opacity="0.82"/>
      <rect x="202" y="470" width="82" height="89" fill="#cdeac0" opacity="0.84"/>
      <path d="M78 653 Q179 673 282 652" fill="none" class="thin"/>
    </g>
    <text x="87" y="365" class="label">共享输入 Tensor</text>
    <text x="79" y="714" class="small">每个模型提取不同子张量</text>

    <!-- Arrows from tensor to first pool -->
    <path d="M307 440 C349 403 356 294 400 269" fill="none" class="thin" marker-end="url(#arrow)"/>
    <path d="M307 515 C350 502 365 460 404 446" fill="none" class="thin" marker-end="url(#arrow)"/>
    <path d="M307 600 C352 615 364 657 405 669" fill="none" class="thin" marker-end="url(#arrow)"/>
    <g transform="rotate(-8 350 500)">
      <rect x="315" y="486" width="91" height="35" rx="10" fill="#fff0b8" stroke="#8a6d1d" stroke-width="2"/>
      <text x="329" y="510" class="tiny">索引</text>
    </g>

    <!-- First thread pool -->
    <g filter="url(#wobble)">
      <rect x="405" y="156" width="425" height="585" rx="28" fill="#eaf4ff" class="ink"/>
      <path d="M432 219 Q614 196 802 219" fill="none" class="thin"/>
    </g>
    <text x="451" y="198" class="label">线程池：第一阶段多个模型</text>

    <!-- Model cards -->
    <g filter="url(#wobble)">
      <g transform="translate(445 247)">
        <rect width="145" height="104" rx="16" fill="#ffd8d8" class="thin"/>
        <circle cx="36" cy="39" r="14" fill="#fff" class="thin"/>
        <path d="M36 53 V78 M22 66 H50 M26 96 L36 78 L48 96" fill="none" class="thin"/>
        <rect x="68" y="22" width="58" height="16" rx="7" fill="#ef7d7d"/>
        <rect x="68" y="49" width="42" height="12" rx="6" fill="#ef7d7d" opacity=".7"/>
        <rect x="68" y="72" width="52" height="12" rx="6" fill="#ef7d7d" opacity=".5"/>
      </g>
      <g transform="translate(644 247)">
        <rect width="145" height="104" rx="16" fill="#d5eaff" class="thin"/>
        <circle cx="36" cy="39" r="14" fill="#fff" class="thin"/>
        <path d="M36 53 V78 M22 66 H50 M26 96 L36 78 L48 96" fill="none" class="thin"/>
        <rect x="68" y="22" width="58" height="16" rx="7" fill="#5b9bd5"/>
        <rect x="68" y="49" width="42" height="12" rx="6" fill="#5b9bd5" opacity=".7"/>
        <rect x="68" y="72" width="52" height="12" rx="6" fill="#5b9bd5" opacity=".5"/>
      </g>
      <g transform="translate(445 406)">
        <rect width="145" height="104" rx="16" fill="#dff2d8" class="thin"/>
        <circle cx="36" cy="39" r="14" fill="#fff" class="thin"/>
        <path d="M36 53 V78 M22 66 H50 M26 96 L36 78 L48 96" fill="none" class="thin"/>
        <rect x="68" y="22" width="58" height="16" rx="7" fill="#67a65a"/>
        <rect x="68" y="49" width="42" height="12" rx="6" fill="#67a65a" opacity=".7"/>
        <rect x="68" y="72" width="52" height="12" rx="6" fill="#67a65a" opacity=".5"/>
      </g>
      <g transform="translate(644 406)">
        <rect width="145" height="104" rx="16" fill="#f3ddff" class="thin"/>
        <circle cx="36" cy="39" r="14" fill="#fff" class="thin"/>
        <path d="M36 53 V78 M22 66 H50 M26 96 L36 78 L48 96" fill="none" class="thin"/>
        <rect x="68" y="22" width="58" height="16" rx="7" fill="#a66bc5"/>
        <rect x="68" y="49" width="42" height="12" rx="6" fill="#a66bc5" opacity=".7"/>
        <rect x="68" y="72" width="52" height="12" rx="6" fill="#a66bc5" opacity=".5"/>
      </g>
      <g transform="translate(544 563)">
        <rect width="145" height="104" rx="16" fill="#ffe4bc" class="thin"/>
        <circle cx="36" cy="39" r="14" fill="#fff" class="thin"/>
        <path d="M36 53 V78 M22 66 H50 M26 96 L36 78 L48 96" fill="none" class="thin"/>
        <rect x="68" y="22" width="58" height="16" rx="7" fill="#dc9845"/>
        <rect x="68" y="49" width="42" height="12" rx="6" fill="#dc9845" opacity=".7"/>
        <rect x="68" y="72" width="52" height="12" rx="6" fill="#dc9845" opacity=".5"/>
      </g>
    </g>
    <text x="596" y="543" class="label">……</text>
    <text x="522" y="714" class="small">每个模型都要单独准备输入、单独 launch</text>

    <!-- Future barrier and reorder desk -->
    <path d="M832 445 H875" fill="none" class="ink" marker-end="url(#arrow)"/>
    <g filter="url(#wobble)">
      <rect x="879" y="230" width="190" height="405" rx="24" fill="#fff1c9" class="ink"/>
      <path d="M904 289 H1043" class="thin"/>
      <path d="M913 331 L947 351 L979 326 L1010 355 L1037 333" fill="none" class="thin dash"/>
      <rect x="908" y="391" width="39" height="39" rx="8" fill="#ef7d7d" class="thin"/>
      <rect x="955" y="391" width="39" height="39" rx="8" fill="#5b9bd5" class="thin"/>
      <rect x="1002" y="391" width="39" height="39" rx="8" fill="#67a65a" class="thin"/>
      <path d="M913 481 H1036 M913 510 H1036 M913 539 H1036" class="thin"/>
      <path d="M935 466 V556 M975 466 V556 M1015 466 V556" class="thin"/>
    </g>
    <text x="930" y="272" class="label">Future</text>
    <text x="905" y="372" class="small">等全部完成</text>
    <text x="899" y="595" class="small">拼接 / 重排</text>
    <text x="906" y="620" class="small">再组织一次</text>

    <!-- Second pool -->
    <path d="M1071 445 H1110" fill="none" class="ink" marker-end="url(#arrow)"/>
    <g filter="url(#wobble)">
      <rect x="1113" y="266" width="213" height="340" rx="26" fill="#f5eafe" class="ink"/>
      <rect x="1145" y="342" width="148" height="42" rx="11" fill="#e0c4f2" class="thin"/>
      <rect x="1145" y="406" width="148" height="42" rx="11" fill="#e0c4f2" class="thin"/>
      <rect x="1145" y="470" width="148" height="42" rx="11" fill="#e0c4f2" class="thin"/>
      <rect x="1145" y="534" width="148" height="42" rx="11" fill="#e0c4f2" class="thin"/>
      <path d="M1170 363 H1268 M1170 427 H1268 M1170 491 H1268 M1170 555 H1268" class="thin"/>
    </g>
    <text x="1143" y="309" class="label">线程池：第二阶段</text>
    <text x="1177" y="654" class="small">又一轮提交</text>

    <!-- GPU single stream -->
    <path d="M1328 445 H1360" fill="none" class="ink" marker-end="url(#arrow)"/>
    <g filter="url(#wobble)">
      <rect x="1364" y="178" width="172" height="504" rx="25" fill="#273142" class="ink"/>
      <rect x="1397" y="249" width="105" height="376" rx="18" fill="#f8fafc" stroke="#9aa4b2" stroke-width="3"/>
      <rect x="1411" y="270" width="77" height="41" rx="8" fill="#4f8bd6"/>
      <rect x="1411" y="324" width="77" height="22" rx="7" fill="#f59c55"/>
      <rect x="1411" y="365" width="77" height="48" rx="8" fill="#4f8bd6"/>
      <rect x="1411" y="445" width="77" height="29" rx="7" fill="#d75a58"/>
      <rect x="1411" y="493" width="77" height="62" rx="8" fill="#4f8bd6"/>
      <rect x="1411" y="586" width="77" height="23" rx="7" fill="#f59c55"/>
      <path d="M1378 218 H1522" stroke="#a9bfdc" stroke-width="5" stroke-linecap="round"/>
    </g>
    <text x="1393" y="159" class="label">GPU</text>
    <text x="1378" y="716" class="small">default stream</text>
    <text x="1373" y="746" class="small">kernel 仍然串行</text>

    <!-- Bottom note -->
    <g transform="rotate(-2 846 810)" filter="url(#wobble)">
      <rect x="428" y="779" width="821" height="72" rx="18" fill="#ffdf85" class="ink"/>
      <text x="501" y="825" class="label">线程很多 ≠ GPU 上的 kernel 真正并行，空隙反而被放大</text>
    </g>
  </g>
</svg>
