<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860">
  <defs>
    <filter id="paper" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="2" seed="5" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="faint"><feFuncA type="table" tableValues="0 0.05"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faint" mode="multiply"/>
    </filter>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="17" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="2.1" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <style>
      .title { font: 700 38px "Comic Sans MS", "Noto Sans CJK SC", sans-serif; fill: #252936; }
      .subtitle { font: 600 24px "Comic Sans MS", "Noto Sans CJK SC", sans-serif; fill: #555d6e; }
      .label { font: 700 25px "Comic Sans MS", "Noto Sans CJK SC", sans-serif; fill: #2f3542; }
      .small { font: 600 20px "Comic Sans MS", "Noto Sans CJK SC", sans-serif; fill: #50586a; }
      .tiny { font: 600 17px "Comic Sans MS", "Noto Sans CJK SC", sans-serif; fill: #50586a; }
      .ink { stroke: #374151; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: #596174; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1600" height="860" rx="34" fill="#fffaf0"/>
  <rect x="18" y="18" width="1564" height="824" rx="28" fill="none" stroke="#374151" stroke-width="4" filter="url(#wobble)"/>
  <g filter="url(#paper)">
    <text x="62" y="72" class="title">把许多张小图拼回一张图，再交给编译器</text>
    <text x="64" y="112" class="subtitle">数据依赖一旦进入 FX Graph，编译器才看得见全局</text>

    <!-- Scattered little graphs -->
    <text x="70" y="183" class="label">许多张独立小图</text>
    <g filter="url(#wobble)">
      <g transform="translate(62 216) rotate(-5 105 70)">
        <rect width="210" height="140" rx="18" fill="#ffdada" class="ink"/>
        <circle cx="42" cy="70" r="15" fill="#fff" class="thin"/><circle cx="105" cy="42" r="15" fill="#fff" class="thin"/><circle cx="165" cy="86" r="15" fill="#fff" class="thin"/>
        <path d="M57 64 L89 48 M120 49 L150 77" class="thin" fill="none" marker-end="url(#arrow)"/>
      </g>
      <g transform="translate(84 382) rotate(4 105 70)">
        <rect width="210" height="140" rx="18" fill="#d8eaff" class="ink"/>
        <circle cx="40" cy="74" r="15" fill="#fff" class="thin"/><circle cx="105" cy="46" r="15" fill="#fff" class="thin"/><circle cx="169" cy="82" r="15" fill="#fff" class="thin"/>
        <path d="M55 68 L90 52 M120 52 L153 75" class="thin" fill="none" marker-end="url(#arrow)"/>
      </g>
      <g transform="translate(55 548) rotate(-3 105 70)">
        <rect width="210" height="140" rx="18" fill="#dff2d8" class="ink"/>
        <circle cx="40" cy="70" r="15" fill="#fff" class="thin"/><circle cx="105" cy="42" r="15" fill="#fff" class="thin"/><circle cx="169" cy="87" r="15" fill="#fff" class="thin"/>
        <path d="M55 64 L90 48 M120 49 L153 80" class="thin" fill="none" marker-end="url(#arrow)"/>
      </g>
      <rect x="238" y="298" width="72" height="42" rx="12" fill="#ffe9a8" class="thin"/>
      <rect x="245" y="470" width="72" height="42" rx="12" fill="#ffe9a8" class="thin"/>
      <rect x="230" y="642" width="72" height="42" rx="12" fill="#ffe9a8" class="thin"/>
    </g>
    <text x="245" y="325" class="small">索引</text>
    <text x="252" y="497" class="small">索引</text>
    <text x="237" y="669" class="small">索引</text>
    <text x="87" y="734" class="small">各自调用，各自管理</text>

    <!-- Merge arrow -->
    <path d="M325 446 C365 446 372 446 410 446" fill="none" class="ink" marker-end="url(#arrow)"/>
    <g transform="rotate(-4 374 401)">
      <rect x="333" y="365" width="95" height="47" rx="12" fill="#ffdf85" class="thin"/>
      <text x="351" y="397" class="small">合图</text>
    </g>

    <!-- Big FX graph parchment -->
    <g filter="url(#wobble)">
      <rect x="421" y="164" width="557" height="566" rx="30" fill="#f7f1df" class="ink"/>
      <path d="M451 221 Q698 196 947 221" class="thin" fill="none"/>
      <rect x="456" y="260" width="93" height="390" rx="18" fill="#fff" class="thin"/>
      <path d="M475 292 H529 M475 326 H529 M475 360 H529 M475 394 H529 M475 428 H529 M475 462 H529 M475 496 H529 M475 530 H529 M475 564 H529 M475 598 H529" class="thin"/>
      <circle cx="611" cy="303" r="23" fill="#ffd1d1" class="thin"/>
      <circle cx="702" cy="303" r="23" fill="#d6eaff" class="thin"/>
      <circle cx="793" cy="303" r="23" fill="#dff2d8" class="thin"/>
      <circle cx="650" cy="410" r="23" fill="#ffe3b2" class="thin"/>
      <circle cx="757" cy="410" r="23" fill="#ead8f5" class="thin"/>
      <circle cx="705" cy="517" r="27" fill="#ffdf85" class="thin"/>
      <rect x="842" y="278" width="43" height="52" rx="12" fill="#f0cced" class="thin"/>
      <rect x="896" y="278" width="43" height="52" rx="12" fill="#f0cced" class="thin"/>
      <rect x="842" y="386" width="43" height="52" rx="12" fill="#f0cced" class="thin"/>
      <rect x="896" y="386" width="43" height="52" rx="12" fill="#f0cced" class="thin"/>
      <rect x="842" y="494" width="43" height="52" rx="12" fill="#f0cced" class="thin"/>
      <rect x="896" y="494" width="43" height="52" rx="12" fill="#f0cced" class="thin"/>
      <path d="M549 318 C574 318 576 303 588 303 M549 394 C590 394 600 410 627 410 M549 500 C603 500 630 517 678 517" class="thin" fill="none" marker-end="url(#arrow)"/>
      <path d="M634 303 H676 M725 303 H767 M633 319 L650 386 M780 323 L757 386 M673 410 H730 M674 431 L697 494 M757 433 L719 496" class="thin" fill="none" marker-end="url(#arrow)"/>
      <path d="M732 507 C785 480 802 304 839 304 M732 507 C797 468 850 304 893 304 M732 517 C780 500 806 412 839 412 M732 517 C794 504 852 412 893 412 M730 530 C780 557 805 520 839 520 M730 530 C790 574 850 520 893 520" class="thin" fill="none" marker-end="url(#arrow)"/>
      <path d="M482 680 Q696 704 912 680" class="thin" fill="none"/>
    </g>
    <text x="584" y="207" class="label">一张完整的 FX Graph</text>
    <text x="466" y="247" class="tiny">输入 Tensor</text>
    <text x="577" y="585" class="small">计算和依赖都在图里</text>
    <g transform="rotate(-6 584 642)">
      <rect x="532" y="617" width="130" height="47" rx="12" fill="#bde0fe" class="thin"/>
      <text x="551" y="648" class="small">静态索引</text>
    </g>
    <g transform="rotate(5 816 636)">
      <rect x="747" y="610" width="142" height="47" rx="12" fill="#cdeac0" class="thin"/>
      <text x="765" y="641" class="small">依赖关系</text>
    </g>

    <!-- Compiler furnace -->
    <path d="M981 446 H1030" fill="none" class="ink" marker-end="url(#arrow)"/>
    <g filter="url(#wobble)">
      <path d="M1033 302 Q1122 263 1210 302 L1192 588 Q1123 629 1050 588 Z" fill="#ffe0b2" class="ink"/>
      <circle cx="1122" cy="415" r="61" fill="#fff4dc" class="ink"/>
      <circle cx="1122" cy="415" r="21" fill="#f5ad55" class="thin"/>
      <path d="M1122 342 V369 M1122 461 V488 M1049 415 H1076 M1168 415 H1195 M1070 363 L1089 382 M1155 448 L1174 467 M1070 467 L1089 448 M1155 382 L1174 363" class="ink" fill="none"/>
      <path d="M1068 528 Q1121 493 1176 528 Q1154 582 1121 586 Q1087 582 1068 528" fill="#f47d4f" class="thin"/>
      <path d="M1097 544 Q1121 522 1146 544 Q1137 570 1121 574 Q1105 570 1097 544" fill="#ffd36d"/>
    </g>
    <text x="1054" y="270" class="label">AOTInductor</text>
    <text x="1064" y="661" class="small">融合 + codegen</text>

    <!-- Package and dense GPU stream -->
    <path d="M1215 446 H1255" fill="none" class="ink" marker-end="url(#arrow)"/>
    <g filter="url(#wobble)">
      <rect x="1259" y="212" width="260" height="189" rx="24" fill="#dcecff" class="ink"/>
      <path d="M1284 265 H1491 M1284 310 H1491 M1284 355 H1439" class="thin"/>
      <circle cx="1471" cy="355" r="24" fill="#77a9df" class="thin"/>
    </g>
    <text x="1301" y="253" class="label">一个 runner</text>
    <text x="1295" y="302" class="small">C++ wrapper</text>
    <text x="1296" y="347" class="small">一次调用</text>

    <path d="M1390 404 V451" fill="none" class="ink" marker-end="url(#arrow)"/>
    <g filter="url(#wobble)">
      <rect x="1262" y="456" width="257" height="220" rx="24" fill="#283345" class="ink"/>
      <rect x="1291" y="515" width="202" height="85" rx="15" fill="#f8fafc" stroke="#9aa4b2" stroke-width="3"/>
      <rect x="1303" y="531" width="31" height="53" rx="6" fill="#4f8bd6"/>
      <rect x="1341" y="531" width="40" height="53" rx="6" fill="#be73c5"/>
      <rect x="1388" y="531" width="29" height="53" rx="6" fill="#ef8c45"/>
      <rect x="1424" y="531" width="57" height="53" rx="6" fill="#4f8bd6"/>
      <path d="M1286 489 H1497" stroke="#a9bfdc" stroke-width="5" stroke-linecap="round"/>
    </g>
    <text x="1322" y="644" class="small" fill="#fff">GPU 连续吃满</text>

    <!-- Benefits -->
    <g filter="url(#wobble)">
      <rect x="364" y="772" width="205" height="54" rx="15" fill="#ffd7d7" class="thin"/>
      <rect x="597" y="772" width="205" height="54" rx="15" fill="#d8eaff" class="thin"/>
      <rect x="830" y="772" width="205" height="54" rx="15" fill="#dff2d8" class="thin"/>
      <rect x="1063" y="772" width="205" height="54" rx="15" fill="#ffe3b2" class="thin"/>
    </g>
    <text x="412" y="807" class="small">少 H2D</text>
    <text x="631" y="807" class="small">少小 kernel</text>
    <text x="877" y="807" class="small">跨图融合</text>
    <text x="1104" y="807" class="small">内存复用</text>
  </g>
</svg>
