<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
<defs>
  <filter id="wob" x="-6%" y="-6%" width="112%" height="112%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="wob2" x="-6%" y="-6%" width="112%" height="112%">
    <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="19" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5"
          markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="#3d3a36"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#fdfcf8"/>
<style>
  text { font-family: "Comic Sans MS", "Chalkboard SE", "Kaiti SC", "STKaiti", KaiTi, "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #3d3a36; }
  .t  { font-size: 21px; font-weight: 700; }
  .h  { font-size: 15px; font-weight: 700; }
  .l  { font-size: 13px; }
  .s  { font-size: 11.5px; fill: #6b6660; }
  .box { stroke: #3d3a36; stroke-width: 2; stroke-linejoin: round; }
  .ln { stroke: #3d3a36; stroke-width: 2; fill: none;
         stroke-linecap: round; stroke-linejoin: round; }
  .dash { stroke: #3d3a36; stroke-width: 1.8; fill: none;
           stroke-dasharray: 6 5; stroke-linecap: round; }
</style>
<text class="t" x="450.0" y="38" text-anchor="middle" >为什么 seq_len 必须搬到显存里去</text>
<g filter="url(#wob)"><rect class="box" x="50" y="62" width="370" height="300" rx="6" fill="#fbe9e6"/></g>
<text class="h" x="235" y="90" text-anchor="middle" >python int 直接传</text>
<g filter="url(#wob)"><rect class="box" x="480" y="62" width="370" height="300" rx="6" fill="#e9f4ec"/></g>
<text class="h" x="665" y="90" text-anchor="middle" >显存里的 pos tensor</text>
<g filter="url(#wob2)"><rect class="box" x="80" y="112" width="310" height="44" rx="6" fill="#ffffff"/></g>
<text class="l" x="235" y="140" text-anchor="middle" >kernel[grid](..., seq_len=20)</text>
<path class="ln" d="M 235 160 L 235 186" marker-end="url(#arw)"/>
<g filter="url(#wob2)"><rect class="box" x="110" y="190" width="250" height="40" rx="6" fill="#ffffff"/></g>
<text class="l" x="235" y="216" text-anchor="middle" >capture 时烧进 launch 配置</text>
<path class="ln" d="M 235 234 L 235 260" marker-end="url(#arw)"/>
<g filter="url(#wob2)"><rect class="box" x="90" y="264" width="290" height="76" rx="6" fill="#f8d9d4"/></g>
<text class="l" x="235" y="290" text-anchor="middle" >replay 第 1 次: seq_len = 20  ✓</text>
<text class="l" x="235" y="312" text-anchor="middle" >replay 第 2 次: seq_len = 20  ✗</text>
<text class="s" x="235" y="332" text-anchor="middle" >第 100 次也还是 20</text>
<g filter="url(#wob2)"><rect class="box" x="510" y="112" width="310" height="44" rx="6" fill="#ffffff"/></g>
<text class="l" x="665" y="140" text-anchor="middle" >kernel[grid](..., pos_ptr=pos)</text>
<path class="ln" d="M 665 160 L 665 186" marker-end="url(#arw)"/>
<g filter="url(#wob2)"><rect class="box" x="540" y="190" width="250" height="40" rx="6" fill="#ffffff"/></g>
<text class="l" x="665" y="216" text-anchor="middle" >烧进去的只是一个地址</text>
<path class="ln" d="M 665 234 L 665 260" marker-end="url(#arw)"/>
<g filter="url(#wob2)"><rect class="box" x="520" y="264" width="290" height="76" rx="6" fill="#d6ecdd"/></g>
<text class="l" x="665" y="290" text-anchor="middle" >kernel 里 tl.load(pos_ptr)</text>
<text class="l" x="665" y="312" text-anchor="middle" >执行那一刻才去读</text>
<text class="s" x="665" y="332" text-anchor="middle" >图内 pos.add_(1) 自增, 每次都对</text>
<text class="s" x="450.0" y="396" text-anchor="middle" >同理: 切片下标也不能用 python int, k_cache[:, t, :] = k 要换成 index_copy_</text>
</svg>
