<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="540" viewBox="0 0 1400 540">
<rect width="100%" height="100%" fill="white"/>
<style>
  text { font-family: Arial, Helvetica, sans-serif; }
  .title { font-size: 23px; font-weight: 700; }
