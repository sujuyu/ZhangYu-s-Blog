<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="470" viewBox="0 0 1400 470">
<rect width="100%" height="100%" fill="#171717"/>
<style>
  text { font-family: Arial, Helvetica, sans-serif; }
  .title { font-size: 23px; font-weight: 700; }
  .subtitle { font-size: 14px; fill: #555; }
  .label { font-size: 13px; }
  .small { font-size: 12px; }
  .axis { stroke: #333; stroke-width: 1.2; }
  .grid { stroke: #999; stroke-width: 0.7; opacity: 0.25; }
</style>
<text x="700" y="42" text-anchor="middle" class="title" fill="white">Actual profiler timeline</text>
<text x="700" y="68" text-anchor="middle" class="subtitle" fill="#cccccc">B=128, E=171, K=7926, N=256</text>
<text x="195" y="172" text-anchor="end" class="label" fill="white">No fold</text>
<rect x="230.0" y="145" width="642.8" height="52" rx="4" fill="#e76f51" stroke="#f1faee"/>
<text x="551.4" y="168" text-anchor="middle" class="label" fill="white">BN affine + cast</text>
<text x="551.4" y="187" text-anchor="middle" class="small" fill="white">1.413 ms</text>
<rect x="873.2" y="145" width="370.9" height="52" rx="4" fill="#457b9d" stroke="#f1faee"/>
<text x="1058.6" y="168" text-anchor="middle" class="label" fill="white">BMM0</text>
<text x="1058.6" y="187" text-anchor="middle" class="small" fill="white">0.815 ms</text>
<rect x="1244.5" y="145" width="4.5" height="52" rx="4" fill="#2a9d8f" stroke="#f1faee"/>
<text x="195" y="287" text-anchor="end" class="label" fill="white">BN folded</text>
<rect x="230.0" y="260" width="290.2" height="52" rx="4" fill="#457b9d" stroke="#f1faee"/>
<text x="375.1" y="283" text-anchor="middle" class="label" fill="white">BMM0 + bias + ReLU</text>
<text x="375.1" y="302" text-anchor="middle" class="small" fill="white">0.638 ms</text>
<line x1="230.0" y1="118" x2="230.0" y2="336" class="grid" stroke="white"/>
<text x="230.0" y="360" text-anchor="middle" class="small" fill="white">0.0</text>
<line x1="457.5" y1="118" x2="457.5" y2="336" class="grid" stroke="white"/>
<text x="457.5" y="360" text-anchor="middle" class="small" fill="white">0.5</text>
<line x1="685.0" y1="118" x2="685.0" y2="336" class="grid" stroke="white"/>
<text x="685.0" y="360" text-anchor="middle" class="small" fill="white">1.0</text>
<line x1="912.5" y1="118" x2="912.5" y2="336" class="grid" stroke="white"/>
<text x="912.5" y="360" text-anchor="middle" class="small" fill="white">1.5</text>
<line x1="1140.0" y1="118" x2="1140.0" y2="336" class="grid" stroke="white"/>
<text x="1140.0" y="360" text-anchor="middle" class="small" fill="white">2.0</text>
<line x1="1367.5" y1="118" x2="1367.5" y2="336" class="grid" stroke="white"/>
<text x="1367.5" y="360" text-anchor="middle" class="small" fill="white">2.5</text>
<text x="700" y="392" text-anchor="middle" class="label" fill="white">time from the beginning of this operator region (ms)</text>
<text x="700" y="430" text-anchor="middle" class="small" fill="#cccccc">The no-fold path writes the expanded BN result to global memory before BMM0.</text>
</svg>
